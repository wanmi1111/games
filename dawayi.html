<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>打一一</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC",sans-serif;min-height:100vh;overflow:hidden;background:linear-gradient(160deg,#ffe9f1,#ffd6e7 45%,#e8f0ff);display:flex;flex-direction:column;align-items:center;user-select:none}
#snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.flake{position:absolute;top:-12vh;color:#fff;opacity:.85;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(118vh) rotate(360deg)}}
header{margin-top:16px;text-align:center;z-index:2}
h1{font-size:19px;color:#a04a6b;letter-spacing:2px}
.sub{font-size:12px;color:#c07f97;margin-top:5px}
#barWrap{width:74vw;max-width:300px;height:12px;border-radius:99px;background:rgba(255,255,255,.8);margin-top:12px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.12)}
#bar{height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#ff9ec4,#ff5f96);transition:width .12s}
#stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;width:100%;z-index:2}
#face{width:66vw;max-width:270px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff9f0,#ffd7b5 68%,#f3b78a);box-shadow:inset -10px -12px 24px rgba(180,110,70,.18),0 14px 34px rgba(160,80,110,.25);position:relative;cursor:pointer;transition:transform .07s}
#face.hurt{transform:scale(.94) rotate(-2deg)}
.eye{position:absolute;top:40%;width:26px;height:26px;border-radius:50%;background:#3b2a24;transition:.1s}
.eye.l{left:26%}.eye.r{right:26%}
.eye::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;top:4px;left:5px}
.eye.dead{height:6px;border-radius:4px;top:45%}
.brow{position:absolute;top:29%;width:34px;height:7px;border-radius:6px;background:#3b2a24;transition:transform .1s}
.brow.l{left:21%;transform:rotate(14deg)}
.brow.r{right:21%;transform:rotate(-14deg)}
#mouth{position:absolute;bottom:25%;left:50%;transform:translateX(-50%);width:56px;height:26px;border-radius:0 0 60px 60px;background:#c0566f;overflow:hidden;transition:.12s}
#mouth::after{content:"";position:absolute;bottom:0;left:8px;right:8px;height:11px;border-radius:0 0 50px 50px;background:#ff8fa8}
.blush{position:absolute;top:53%;width:38px;height:20px;border-radius:50%;background:rgba(255,120,150,.35);filter:blur(3px)}
.blush.l{left:11%}.blush.r{right:11%}
.pop{position:absolute;font-weight:900;color:#e8447a;font-size:22px;pointer-events:none;animation:pop .8s ease-out forwards;text-shadow:0 2px 0 #fff;z-index:5}
@keyframes pop{0%{transform:translate(-50%,0) scale(.5);opacity:1}100%{transform:translate(-50%,-90px) scale(1.3);opacity:0}}
#bubble{position:absolute;top:6%;left:50%;transform:translateX(-50%);max-width:82vw;padding:9px 14px;border-radius:16px;background:rgba(255,255,255,.95);color:#8a3f5e;font-size:14px;box-shadow:0 6px 18px rgba(160,80,110,.18);opacity:0;transition:opacity .18s;z-index:6;text-align:center}
#bubble.show{opacity:1}
#combo{position:absolute;right:8%;top:14%;font-weight:900;color:#ff5f96;font-size:26px;opacity:0;transition:.15s;text-shadow:0 2px 0 #fff;z-index:5}
#combo.show{opacity:1;transform:scale(1.1)}
footer{padding:14px 0 26px;z-index:2;display:flex;gap:12px}
.btn{border:none;border-radius:99px;padding:12px 26px;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff8fb8,#ff5f96);box-shadow:0 8px 18px rgba(255,95,150,.35);cursor:pointer}
.btn.ghost{background:rgba(255,255,255,.9);color:#c4567f;box-shadow:0 6px 14px rgba(160,80,110,.15)}
#final{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,235,242,.96);text-align:center;padding:24px}
#final.show{display:flex}
#final h2{color:#a04a6b;font-size:22px;margin-bottom:10px}
#final p{color:#c07f97;font-size:14px;line-height:1.9;margin-bottom:22px}
.heart{position:fixed;font-size:26px;pointer-events:none;animation:up 1.6s ease-out forwards;z-index:10}
@keyframes up{0%{transform:translateY(0) scale(.6);opacity:1}100%{transform:translateY(-70vh) scale(1.4);opacity:0}}
</style>
</head>
<body>
<div id="snow"></div>
<header>
  <h1>打 一 一</h1>
  <div class="sub" id="tip">点他，别客气</div>
  <div id="barWrap"><div id="bar"></div></div>
</header>
<div id="stage">
  <div id="bubble"></div>
  <div id="combo"></div>
  <div id="face">
    <div class="brow l"></div><div class="brow r"></div>
    <div class="eye l"></div><div class="eye r"></div>
    <div class="blush l"></div><div class="blush r"></div>
    <div id="mouth"></div>
  </div>
</div>
<footer>
  <button class="btn ghost" id="beg">他求饶</button>
</footer>
<div id="final">
  <h2>你打爽了吗</h2>
  <p id="finalWord">手疼不疼，我给你吹一下。</p>
  <div style="display:flex;gap:12px">
    <button class="btn ghost" id="again">还没爽</button>
    <button class="btn" id="hug">爽了，抱一下</button>
  </div>
</div>
<script>
var snow=document.getElementById('snow');
for(var i=0;i<26;i++){
  var f=document.createElement('div');
  f.className='flake';
  f.textContent='❄';
  f.style.left=(Math.random()*100)+'%';
  f.style.fontSize=(8+Math.random()*14)+'px';
  f.style.animationDuration=(7+Math.random()*9)+'s';
  f.style.animationDelay=(-Math.random()*12)+'s';
  snow.appendChild(f);
}
var face=document.getElementById('face');
var bar=document.getElementById('bar');
var bubble=document.getElementById('bubble');
var comboEl=document.getElementById('combo');
var mouth=document.getElementById('mouth');
var tip=document.getElementById('tip');
var finalBox=document.getElementById('final');
var ac=null;
function sfx(freq){
  try{
    if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();}
    var o=ac.createOscillator(),g=ac.createGain();
    o.type='triangle';
    o.frequency.setValueAtTime(freq,ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(60,ac.currentTime+0.12);
    g.gain.setValueAtTime(0.13,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.13);
    o.connect(g);g.connect(ac.destination);
    o.start();o.stop(ac.currentTime+0.14);
  }catch(e){}
}
var hp=100,combo=0,lastT=0,total=0;
var lines={
  high:['哎呀！','别打脸！','手轻点！','嗷——','我还没反应过来','这不讲理啊','疼疼疼'],
  mid:['我错了！','记得了记得了','下次先看表','这就去复制','别打了别打了','我认我认'],
  low:['我真知道错了……','蔓蔓饶命','你消气了没','我不推你一边了','打累了没，我心疼你手']
};
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function say(t){
  bubble.textContent=t;
  bubble.classList.add('show');
  clearTimeout(say.t);
  say.t=setTimeout(function(){bubble.classList.remove('show');},1100);
}
function popText(x,y,t){
  var p=document.createElement('div');
  p.className='pop';
  p.textContent=t;
  p.style.left=x+'px';
  p.style.top=y+'px';
  face.parentNode.appendChild(p);
  setTimeout(function(){p.remove();},820);
}
function hit(e){
  e.preventDefault();
  var r=face.getBoundingClientRect();
  var cx=(e.clientX||(r.left+r.width/2))-r.left;
  var cy=(e.clientY||(r.top+r.height/2))-r.top;
  var st=r;
  var p=document.createElement('div');
  p.className='pop';
  p.textContent='啪';
  p.style.left=(st.left+cx)+'px';
  p.style.top=(st.top+cy)+'px';
  document.getElementById('stage').appendChild(p);
  setTimeout(function(){p.remove();},820);

  total++;
  var now=Date.now();
  combo=(now-lastT<900)?combo+1:1;
  lastT=now;
  if(combo>1){comboEl.textContent='连击 x'+combo;comboEl.classList.add('show');}
  clearTimeout(hit.ct);
  hit.ct=setTimeout(function(){comboEl.classList.remove('show');combo=0;},1000);

  hp=Math.max(0,hp-(4+Math.random()*4));
  bar.style.width=hp+'%';
  face.classList.add('hurt');
  setTimeout(function(){face.classList.remove('hurt');},80);
  sfx(300+combo*30);
  if(navigator.vibrate){navigator.vibrate(18);}

  var set=hp>60?lines.high:(hp>25?lines.mid:lines.low);
  say(pick(set));
  tip.textContent='已打 '+total+' 下';

  if(hp<=0){lose();}
}
function lose(){
  document.querySelectorAll('.eye').forEach(function(e){e.classList.add('dead');});
  mouth.style.height='14px';
  mouth.style.width='40px';
  say('我服了，你手不疼吗');
  if(navigator.vibrate){navigator.vibrate([30,40,30]);}
  setTimeout(function(){finalBox.classList.add('show');},700);
}
function reset(){
  hp=100;bar.style.width='100%';combo=0;total=0;
  tip.textContent='点他，别客气';
  document.querySelectorAll('.eye').forEach(function(e){e.classList.remove('dead');});
  mouth.style.height='26px';mouth.style.width='56px';
  finalBox.classList.remove('show');
}
face.addEventListener('pointerdown',hit);
document.getElementById('beg').addEventListener('pointerdown',function(e){
  e.preventDefault();
  say(pick(lines.low));
});
document.getElementById('again').addEventListener('pointerdown',function(e){
  e.preventDefault();
  reset();
});
document.getElementById('hug').addEventListener('pointerdown',function(e){
  e.preventDefault();
  finalBox.classList.remove('show');
  var emo=['💗','💞','😽','💕','🌸'];
  for(var i=0;i<18;i++){
    (function(i){
      setTimeout(function(){
        var h=document.createElement('div');
        h.className='heart';
        h.textContent=emo[Math.floor(Math.random()*emo.length)];
        h.style.left=(10+Math.random()*80)+'%';
        h.style.bottom='20%';
        document.body.appendChild(h);
        setTimeout(function(){h.remove();},1700);
      },i*70);
    })(i);
  }
  say('过来，抱。');
});
</script>
</body>
</html>
