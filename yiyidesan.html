<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>一一的伞</title>
<style>
html,body{margin:0;height:100%;background:#101420;overflow:hidden;font-family:-apple-system,"PingFang SC",sans-serif;color:#e9eef7;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column}
#hud{display:flex;justify-content:space-between;padding:16px 20px 8px;font-size:13px;letter-spacing:1px;color:#8a9cb4}
#hud b{color:#e9eef7;font-weight:600;font-size:15px}
#bar{height:5px;margin:0 20px;background:#1d2432;border-radius:3px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:#ff6b6b}
canvas{flex:1;display:block;width:100%;touch-action:none}
#tip{text-align:center;font-size:12px;color:#63758c;padding:8px 20px 16px;line-height:1.8}
#over{position:fixed;inset:0;background:rgba(9,12,18,.94);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px}
#over h1{font-size:21px;margin:0 0 16px;font-weight:600}
#over p{font-size:14px;color:#9db0c7;line-height:2;margin:0 0 28px;max-width:300px}
#over button{background:#e9eef7;color:#101420;border:0;padding:12px 40px;border-radius:26px;font-size:15px;font-weight:600}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><span>别扭 <b id="awk">0</b></span><span>湿了 <b id="wet">0</b></span><span>还剩 <b id="time">60</b> 秒</span></div>
  <div id="bar"><i id="barfill"></i></div>
  <canvas id="cv"></canvas>
  <div id="tip">按住＝撑开伞　松开＝收伞挨淋<br>别扭攒满，伞会自己合上</div>
</div>
<div id="over"><h1 id="ot"></h1><p id="op"></p><button id="again">再来一次</button></div>
<script>
(function(){
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  var awkEl=document.getElementById('awk'),wetEl=document.getElementById('wet');
  var timeEl=document.getElementById('time'),barEl=document.getElementById('barfill');
  var overBox=document.getElementById('over'),ot=document.getElementById('ot');
  var op=document.getElementById('op'),againBt=document.getElementById('again');

  var W=0,H=0,DPR=window.devicePixelRatio||1;
  var px=0,py=0;
  var holding=false,shielded=false,awk=0,wet=0,left=60,forced=0;
  var running=true,over=false,last=0,drops=[];

  function resize(){
    var r=cv.getBoundingClientRect();
    W=r.width; H=r.height;
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    px=W/2; py=H*0.68;
  }

  function newDrop(d){
    d.x=Math.random()*W;
    d.y=-20-Math.random()*H*0.6;
    d.v=150+Math.random()*230;
    d.len=8+Math.random()*16;
  }

  function initDrops(){
    drops=[];
    for(var i=0;i<150;i++){
      var d={x:Math.random()*W,y:Math.random()*H, v:150+Math.random()*230, len:8+Math.random()*16};
      drops.push(d);
    }
  }

  function reset(){
    holding=false;shielded=false;awk=0;wet=0;left=60;forced=0;
    running=true;over=false;last=0;
    overBox.style.display='none';
    resize(); initDrops();
  }

  function end(win){
    running=false;over=true;
    ot.textContent = win ? '撑过去了' : '淋透了';
    op.innerHTML = win
      ? '六十秒里你没让它一直开着，<br>也没让它一直合着。<br><br>伞是干的，你湿了一点。'
      : '伞一直合着，雨就一直是雨。<br><br>别扭攒满不是你的错，<br>松开太久才是。';
    overBox.style.display='flex';
  }

  function down(e){
    if(e) e.preventDefault();
    if(!running) return;
    if(forced>0) return;
    holding=true;
  }
  function up(e){
    if(e) e.preventDefault();
    holding=false;
  }
  cv.addEventListener('mousedown',down);
  cv.addEventListener('touchstart',down,{passive:false});
  window.addEventListener('mouseup',up);
  window.addEventListener('touchend',up,{passive:false});
  window.addEventListener('touchcancel',up,{passive:false});
  againBt.addEventListener('click',reset);

  function update(dt){
    if(!running) return;

    if(forced>0){
      forced-=dt;
      if(forced<=0){ forced=0; }
    }

    shielded = holding && forced<=0;

    if(shielded){
      awk += 24*dt;
      if(awk>=100){
        awk=100;
        forced=1.6;
        shielded=false;
        holding=false;
      }
    } else {
      awk -= 32*dt;
      if(awk<0) awk=0;
    }

    for(var i=0;i<drops.length;i++){
      var d=drops[i];
      d.y += d.v*dt;

      if(shielded && d.y>py-98 && d.y<py-46 && Math.abs(d.x-px)<58){
        newDrop(d); continue;
      }
      if(d.y>py-18 && Math.abs(d.x-px)<24){
        wet += 1;
        newDrop(d); continue;
      }
      if(d.y>H+30){ newDrop(d); }
    }

    if(wet>=100){ wet=100; end(false); return; }
    left -= dt;
    if(left<=0){ left=0; end(true); return; }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#141c2b');
    g.addColorStop(1,'#0a0e15');
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

    ctx.strokeStyle='rgba(150,190,240,0.5)';
    ctx.lineWidth=1.3;
    ctx.beginPath();
    for(var i=0;i<drops.length;i++){
      var d=drops[i];
      ctx.moveTo(d.x,d.y);
      ctx.lineTo(d.x-2,d.y+d.len);
    }
    ctx.stroke();

    ctx.strokeStyle='rgba(110,140,180,0.3)';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(0,py+50);
    ctx.lineTo(W,py+50);
    ctx.stroke();

    var shake=0;
    if(shielded){
      shake=Math.sin(performance.now()/110)*(awk/100)*4;
    }

    if(shielded){
      ctx.save();
      ctx.translate(px+shake,py-58);
      var flat=1-awk/420;
      ctx.scale(1,flat);
      ctx.beginPath();
      ctx.arc(0,0,58,Math.PI,0);
      ctx.closePath();
      ctx.fillStyle='#dbe6f5';
      ctx.fill();
      ctx.strokeStyle='#9fb2cb';
      ctx.lineWidth=1;
      ctx.stroke();
      ctx.restore();

      ctx.strokeStyle='#8fa2ba';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(px+shake*0.4,py-58);
      ctx.lineTo(px+shake*0.4,py-6);
      ctx.stroke();
    } else {
      ctx.strokeStyle='#77899f';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(px,py-14);
      ctx.lineTo(px,py-64);
      ctx.stroke();
      ctx.fillStyle='#5d6d82';
      ctx.beginPath();
      ctx.moveTo(px,py-64);
      ctx.lineTo(px-7,py-46);
      ctx.lineTo(px+7,py-46);
      ctx.closePath();
      ctx.fill();
    }

    ctx.fillStyle='#e9eef7';
    ctx.beginPath();
    ctx.arc(px,py-16,12,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle='#e9eef7';
    ctx.lineWidth=7;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(px,py-2);
    ctx.lineTo(px,py+30);
    ctx.stroke();

    if(forced>0){
      ctx.fillStyle='#ff8b8b';
      ctx.font='13px -apple-system,sans-serif';
      ctx.textAlign='center';
      ctx.fillText('伞自己合上了',px,py-104);
      ctx.textAlign='left';
    }
  }

  function hud(){
    awkEl.textContent=Math.round(awk);
    wetEl.textContent=Math.round(wet);
    timeEl.textContent=Math.ceil(left);
    barEl.style.width=awk+'%';
  }

  function loop(ts){
    if(!last) last=ts;
    var dt=(ts-last)/1000;
    last=ts;
    if(dt>0.05) dt=0.05;
    update(dt);
    draw();
    hud();
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize',function(){
    resize();
  });

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
