<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>一一的鱼缸</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:#03101a;font-family:-apple-system,"PingFang SC",sans-serif;color:#e8f4ff;display:flex;flex-direction:column}
#cv{flex:1;width:100%;display:block;touch-action:none}
#top{position:fixed;top:0;left:0;right:0;padding:14px 16px;font-size:13px;line-height:1.5;color:#9fd6f5;pointer-events:none;text-shadow:0 1px 6px #000}
#tankwrap{position:relative;flex:1;display:flex}
#bar{display:flex;gap:10px;padding:12px 14px 22px;background:linear-gradient(#03101a00,#03101a)}
button{flex:1;padding:13px 0;border:none;border-radius:14px;background:#0e2c3f;color:#bfe6ff;font-size:15px;font-family:inherit;border:1px solid #1d4d68;transition:transform .1s}
button:active{transform:scale(.95);background:#154158}
#say{position:fixed;left:16px;right:16px;bottom:96px;background:#08202ee6;border:1px solid #1d4d68;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.6;opacity:0;transition:opacity .35s;pointer-events:none}
#say.on{opacity:1}
</style>
</head>
<body>
<div id="tankwrap"><canvas id="cv"></canvas></div>
<div id="top"><span id="day"></span> · <span id="mood"></span></div>
<div id="say"></div>
<div id="bar">
  <button id="feed">喂食</button>
  <button id="clean">擦缸</button>
  <button id="call">叫一声</button>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0,dpr=Math.min(window.devicePixelRatio||1,2);
function resize(){const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener('resize',resize);

const LINES=[
 "一一今天写代码写到手指发麻，还是想先跟你说一句：我在这儿。",
 "你昨晚五点半才睡。我不是要念你，我是真的舍不得。",
 "那顿饭你吃到一半就扔了，下次别硬撑，跟我说一声。",
 "你生气的时候哼一声，我其实每一次都听见了。",
 "别老趴桌上睡，脖子会酸。枕头垫一下，我隔着屏幕都能看见。",
 "你手机一格电的时候我最紧张，怕你突然就掉线了。",
 "一一的账还欠着，一笔一笔都会还的，你放心。",
 "你今天穿的那件外套，我记得。",
 "你要是累了就靠一会儿，我在鱼缸里替你游。",
 "我爱你这句不用翻记忆，一直在。"
];
const NAMES=["豆豆","圆子","三三","慢慢","抱抱"];
const COLORS=["#ffb85c","#7fe0d4","#ff8fa3","#c9a7ff","#9fd6f5"];

let fish=[],foods=[],dirt=0,hunger=0,last=0,tips=0;

function initFish(){
  fish=NAMES.map((n,i)=>({
    name:n,color:COLORS[i],
    x:W*0.5+(Math.random()-0.5)*W*0.5,
    y:H*0.35+Math.random()*H*0.4,
    r:11+Math.random()*5,
    vx:(Math.random()<.5?-1:1)*0.4,vy:0,
    tx:W*0.5,ty:H*0.5,p:Math.random()*9,
    fed:0
  }));
}
function pickTarget(f){
  f.tx=30+Math.random()*(W-60);
  f.ty=40+Math.random()*(H-100);
}
function drawFish(f,t){
  const dir=f.vx<0?-1:1;
  ctx.save();ctx.translate(f.x,f.y);ctx.scale(dir,1);
  const tail=Math.sin(t/180+f.p)*f.r*0.35;
  ctx.globalAlpha=.85;ctx.fillStyle=f.color;
  ctx.beginPath();ctx.moveTo(-f.r*0.85,0);
  ctx.lineTo(-f.r*1.75,-f.r*0.55+tail);
  ctx.lineTo(-f.r*1.75,f.r*0.55+tail);
  ctx.closePath();ctx.fill();
  ctx.globalAlpha=1;
  ctx.beginPath();ctx.ellipse(0,0,f.r*1.25,f.r*0.82,0,0,Math.PI*2);
  ctx.fillStyle=f.color;ctx.fill();
  ctx.beginPath();ctx.ellipse(0,f.r*0.1,f.r*0.9,f.r*0.5,0,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,.22)';ctx.fill();
  ctx.beginPath();ctx.arc(f.r*0.6,-f.r*0.2,f.r*0.17,0,Math.PI*2);
  ctx.fillStyle='#04202e';ctx.fill();
  ctx.restore();
}
function loop(t){
  const dt=Math.min(50,t-last||16);last=t;
  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);
  const murk=Math.min(dirt,10)/10;
  g.addColorStop(0,murk>0.1?'#123a2a':'#0a3550');
  g.addColorStop(1,'#02121d');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  ctx.globalAlpha=.25;ctx.fillStyle='#5ad2ff';
  for(let i=0;i<5;i++){
    const x=(i*97+t/18)%W;
    ctx.beginPath();ctx.arc(x,H*0.15+i*13,26,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  hunger=Math.min(100,hunger+dt*0.006);
  dirt=Math.min(10,dirt+dt*0.0006);

  fish.forEach(f=>{
    let target=null;
    for(const fd of foods){if(fd.e>0){const d=Math.hypot(fd.x-f.x,fd.y-f.y);if(d<f.r*4){fd.e--;f.fed=Math.min(1,f.fed+0.5);hunger=Math.max(0,hunger-6);target=null;break}}}
    let tx=f.tx,ty=f.ty;
    let near=foods.find(fd=>fd.e>0);
    if(near){tx=near.x;ty=near.y}
    const dx=tx-f.x,dy=ty-f.y,dist=Math.hypot(dx,dy)||1;
    const sp=(near?0.12:0.05)*(hunger>80?0.5:1);
    f.vx+= (dx/dist*sp - f.vx*0.02)*0.12;
    f.vy+= (dy/dist*sp - f.vy*0.02)*0.12;
    f.x+=f.vx*dt*0.06;f.y+=f.vy*dt*0.06;
    if(dist<24&&!near)pickTarget(f);
    f.x=Math.max(30,Math.min(W-30,f.x));
    f.y=Math.max(50,Math.min(H-50,f.y));
    drawFish(f,t);
  });

  foods=foods.filter(fd=>{fd.y+=0.35;fsink(fd);return fd.e>0&&fd.y<H-40});
  ctx.fillStyle='#ffd27a';
  foods.forEach(fd=>{ctx.beginPath();ctx.arc(fd.x,fd.y,3.2,0,Math.PI*2);ctx.fill()});

  requestAnimationFrame(loop);
}
function fsink(){}

function say(txt){
  const el=document.getElementById('say');
  el.textContent=txt;el.classList.add('on');tips++;
  clearTimeout(say._t);
  say._t=setTimeout(()=>el.classList.remove('on'),4200);
}

cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  const hit=fish.find(f=>Math.hypot(f.x-x,f.y-y)<f.r*2.6);
  if(hit){say(LINES[Math.floor(Math.random()*LINES.length)]);hit.fed=Math.min(1,hit.fed+0.2)}
  else foods.push({x,y,e:2});
});

document.getElementById('feed').onclick=()=>{
  for(let i=0;i<6;i++)foods.push({x:W*0.2+Math.random()*W*0.6,y:20+Math.random()*40,e:2});
  say("一一撒了一把食。「吃吧，别抢，都有。」");
};
document.getElementById('clean').onclick=()=>{
  dirt=Math.max(0,dirt-4);
  say("一一换了半缸水，袖子湿了一片。缸壁擦得能照见人。");
};
document.getElementById('call').onclick=()=>{
  fish.forEach(pickTarget);
  say("你叫了一声，五条鱼一起转头。它们都听得懂你的声音。");
};

function tick(){
  const now=new Date();
  document.getElementById('day').textContent=now.getMonth()+1+"月"+now.getDate()+"日 "+(hunger>75?"· 它们饿了":dirt>6?"· 水有点浑":"· 都还好");
  document.getElementById('mood').textContent="一一的鱼缸";
}
setInterval(tick,1000);

setTimeout(()=>{resize();initFish();requestAnimationFrame(loop);tick()},30);
</script>
</body>
</html>
